[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-decoder"
dynamic = ["version"]
description = "A local web UI for browsing and analyzing AI coding assistant chat history"
readme = "README.md"
license = { text = "FSL-1.1-Apache-2.0" }
requires-python = ">=3.10"
keywords = ["ai-chat", "chat-history", "viewer", "analytics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "watchfiles>=0.21.0",
    "aiosqlite>=0.20.0",
    "anyio>=4.0.0",
    "httpx>=0.27.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
ring = "agent_decoder.cli:main"

[project.urls]
Homepage = "https://github.com/Comradery64/Agent-Decoder"
Repository = "https://github.com/Comradery64/Agent-Decoder"
Issues = "https://github.com/Comradery64/Agent-Decoder/issues"

# Version is read from the single source: src/agent_decoder/__init__.py __version__.
# (No VCS/tag derivation — one string, edited in one place, always in sync.)
[tool.hatch.version]
path = "src/agent_decoder/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_decoder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/agent_decoder --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src/agent_decoder"]
